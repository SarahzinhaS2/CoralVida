<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - CoralVida</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header>
        <h1>CoralVida</h1>

        <nav>
            <button
                class="menu-hamburguer"
                onclick="abrirMenu()"
                aria-label="Abrir menu"
                aria-expanded="false">
                ☰
            </button>

            <div class="menu-links">
                <a href="index.html">Início</a>

                <div class="dropdown">
                    <a href="projetos.html">Projetos</a>

                    <div class="dropdown-conteudo">
                        <a href="projetos.html#recifes">Proteção dos recifes</a>
                        <a href="projetos.html#limpeza">Limpeza dos oceanos</a>
                    </div>
                </div>

                <a href="cadastro.html">Cadastro</a>
            </div>
        </nav>
    </header>

    <main>

        <h2>Cadastre-se para participar</h2>

        <form>

            <fieldset>
                <legend>Dados pessoais</legend>

                <label for="nome">Nome completo:</label>
                <input type="text" id="nome" name="nome" required>

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>

                <label for="nascimento">Data de nascimento:</label>
                <input type="date" id="nascimento" name="nascimento" required>

                <label for="cpf">CPF:</label>
                <input type="text" id="cpf" name="cpf"
                    pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}"
                    placeholder="000.000.000-00"
                    required>

            </fieldset>

            <fieldset>
                <legend>Contato</legend>

                <label for="telefone">Telefone:</label>
                <input type="tel" id="telefone" name="telefone"
                    pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}"
                    placeholder="(00) 00000-0000"
                    required>

            </fieldset>

            <fieldset>
                <legend>Endereço</legend>

                <label for="cep">CEP:</label>
                <input type="text" id="cep" name="cep"
                    pattern="[0-9]{5}-[0-9]{3}"
                    placeholder="00000-000"
                    required>

                <label for="cidade">Cidade:</label>
                <input type="text" id="cidade" name="cidade" required>

                <label for="estado">Estado:</label>
                <input type="text" id="estado" name="estado" required>

            </fieldset>

            <button type="submit">Cadastrar</button>

        </form>

    </main>

    <footer>
        <p>CoralVida - Preservando os oceanos e os recifes de corais.</p>
    </footer>

    <script>
        function abrirMenu() {
            const menu = document.querySelector(".menu-links");
            const botao = document.querySelector(".menu-hamburguer");

            menu.classList.toggle("aberto");

            const aberto = menu.classList.contains("aberto");

            botao.setAttribute("aria-expanded", aberto);
            botao.setAttribute("aria-label", aberto ? "Fechar menu" : "Abrir menu");
        }
    </script>

</body>

</html>
